description: "Recover from Primary Region Failure"
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  SecondaryInstanceId:
    type: String
    description: "The ID of the secondary instance to start"
  SecondaryRegion:
    type: String
    description: "The region of the secondary instance"
  EndpointGroupArn:
    type: String
    description: "The ARN of the Global Accelerator Endpoint Group to update"
  AutomationAssumeRole:
    type: String
    description: "The IAM role ARN for SSM to assume"

mainSteps:
  - name: StartSecondaryInstance
    action: "aws:executeScript"
    inputs:
      Runtime: "python3.11"
      Handler: "start_handler"
      InputPayload:
        InstanceId: "{{ SecondaryInstanceId }}"
        Region: "{{ SecondaryRegion }}"
      Script: |
        import boto3

        def start_handler(events, context):
            ec2 = boto3.client('ec2', region_name=events['Region'])
            instance_id = events['InstanceId']

            print(f"Starting instance {instance_id} in {events['Region']}")

            response = ec2.start_instances(InstanceIds=[instance_id])
            print(f"Start command sent: {response}")

            return {'Status': 'Starting'}
    isEnd: false

  - name: WaitForInstanceRunning
    action: "aws:executeScript"
    inputs:
      Runtime: "python3.11"
      Handler: "wait_handler"
      InputPayload:
        InstanceId: "{{ SecondaryInstanceId }}"
        Region: "{{ SecondaryRegion }}"
      Script: |
        import boto3
        import time

        def wait_handler(events, context):
            ec2 = boto3.client('ec2', region_name=events['Region'])
            instance_id = events['InstanceId']
            
            print(f"Waiting for instance {instance_id} to be running in {events['Region']}")
            
            while True:
                response = ec2.describe_instances(InstanceIds=[instance_id])
                state = response['Reservations'][0]['Instances'][0]['State']['Name']
                print(f"Current state: {state}")
                
                if state == 'running':
                    break
                
                time.sleep(5)
            
            return {'Status': 'Running'}
    isEnd: false

  - name: UpdateGlobalAcceleratorWeight
    action: "aws:executeScript"
    inputs:
      Runtime: "python3.11"
      Handler: "script_handler"
      InputPayload:
        EndpointGroupArn: "{{ EndpointGroupArn }}"
        InstanceId: "{{ SecondaryInstanceId }}"
      Script: |
        import boto3

        def script_handler(events, context):
            ga = boto3.client('globalaccelerator', region_name='us-west-2')
            endpoint_group_arn = events['EndpointGroupArn']
            instance_id = events['InstanceId']

            print(f"Updating Global Accelerator endpoint group: {endpoint_group_arn}")
            print(f"Setting secondary instance {instance_id} to weight 100")

            response = ga.update_endpoint_group(
                EndpointGroupArn=endpoint_group_arn,
                EndpointConfigurations=[
                    {
                        'EndpointId': instance_id,
                        'Weight': 100,
                        'ClientIPPreservationEnabled': True
                    }
                ]
            )
            print(f"Updated successfully: {response}")
            return {'Status': 'Updated'}
    isEnd: true
